name: Lark Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'demo-app/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  sentinel:
    name: Generate diff-targeted Lark workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # In a real repo you'd resolve the actual preview URL from your deploy provider here.
      # For Vercel: use the official `vercel/preview-url-action` or read deployments API.
      # For this hackathon demo we accept it as a repo variable.
      - name: Resolve preview URL
        id: preview
        run: |
          if [ -n "${{ vars.PREVIEW_URL }}" ]; then
            echo "url=${{ vars.PREVIEW_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://sentinel-demo.example.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Lark Sentinel
        uses: ./sentinel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lark-api-key: ${{ secrets.GETLARK_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          preview-url: ${{ steps.preview.outputs.url }}
          max-workflows: '4'
          repair-on-flake: 'true'
          linear-api-key: ${{ secrets.LINEAR_API_KEY }}
          linear-team-id: ${{ vars.LINEAR_TEAM_ID }}
